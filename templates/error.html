{% extends "base.html" %}
{% block title %}{{ code }} - Yellow Pages CRM{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-4 text-muted">{{ code }}</h1>
  <p class="lead">{{ message }}</p>
  <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary">
    <i class="fa-solid fa-house"></i> Go Home
  </a>
</div>
{% endblock %}
